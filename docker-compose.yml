services:
  # MongoDB Primary
  mongodb_primary:
    image: mongo:7
    container_name: housing_mongodb_primary
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change_me_in_production}
      MONGO_INITDB_DATABASE: housing_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_primary_data:/data/db
      - mongodb_config:/data/configdb
    command: mongod --replSet rs0 --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - housing_network

  # MongoDB Secondary (Read Replica)
  mongodb_secondary:
    image: mongo:7
    container_name: housing_mongodb_secondary
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change_me_in_production}
    ports:
      - "27018:27017"
    volumes:
      - mongodb_secondary_data:/data/db
    command: mongod --replSet rs0 --bind_ip_all
    depends_on:
      - mongodb_primary
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - housing_network

  # MongoDB Arbiter
  mongodb_arbiter:
    image: mongo:7
    container_name: housing_mongodb_arbiter
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change_me_in_production}
    command: mongod --replSet rs0 --bind_ip_all
    depends_on:
      - mongodb_primary
    networks:
      - housing_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: housing_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me_in_production}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me_in_production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - housing_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: housing_backend
    environment:
      DATABASE_URL: mongodb://admin:${MONGO_ROOT_PASSWORD:-change_me_in_production}@mongodb_primary:27017/housing_db?replicaSet=rs0&w=majority
      READ_REPLICA_URL: mongodb://admin:${MONGO_ROOT_PASSWORD:-change_me_in_production}@mongodb_secondary:27017/housing_db?replicaSet=rs0&readPreference=secondaryPreferred
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_in_production}@redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-key-change-in-production}
      ENVIRONMENT: production
      DEBUG: "false"
      MAX_DB_CONNECTIONS: "100"
      MIN_DB_CONNECTIONS: "10"
    ports:
      - "8000:8000"
    depends_on:
      mongodb_primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    networks:
      - housing_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: housing_frontend
    environment:
      VITE_API_URL: ${API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - housing_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: housing_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - housing_network
    restart: unless-stopped

volumes:
  mongodb_primary_data:
  mongodb_secondary_data:
  mongodb_config:
  backend_logs:

networks:
  housing_network:
    driver: bridge
