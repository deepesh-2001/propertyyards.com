apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-price-service
  namespace: production
  labels:
    app: flight-price-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: flight-price-service
  template:
    metadata:
      labels:
        app: flight-price-service
    spec:
      containers:
        - name: flight-price
          image: propertyyards/flight-price-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: PORT
              value: "8001"
            - name: SKYSCANNER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flight-service-secrets
                  key: skyscanner-api-key
                  optional: true
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flight-price-service
  namespace: production
spec:
  selector:
    app: flight-price-service
  ports:
    - port: 80
      targetPort: 8001
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flight-price-service-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flight-price-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Secrets
apiVersion: v1
kind: Secret
metadata:
  name: flight-service-secrets
  namespace: production
type: Opaque
stringData:
  skyscanner-api-key: ""  # Add your API key here
