apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: propertyyards-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - propertyyards.com
        - www.propertyyards.com
        - api.propertyyards.com
      secretName: propertyyards-tls
  rules:
    - host: propertyyards.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: www.propertyyards.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.propertyyards.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: propertyyards-api
                port:
                  number: 80
---
# Certificate for HTTPS
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: propertyyards-cert
  namespace: production
spec:
  secretName: propertyyards-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - propertyyards.com
    - www.propertyyards.com
    - api.propertyyards.com
