name: 🚀 CI/CD Pipeline - Microservices

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # ==========================================
  # 🔍 CODE QUALITY & TESTS
  # ==========================================
  test-auth-service:
    name: 🧪 Test Auth Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./microservices/auth-service
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 📦 Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      
      - name: 🧪 Run Tests
        run: pytest tests/ -v --cov=app --cov-report=xml
      
      - name: 📊 Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: auth-service
          name: auth-service-coverage

  test-property-service:
    name: 🧪 Test Property Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./microservices/property-service
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      - run: pytest tests/ -v --cov=app --cov-report=xml
      - uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: property-service

  test-user-service:
    name: 🧪 Test User Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./microservices/user-service
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - run: pytest tests/ -v

  # ==========================================
  # 🏗️ BUILD SERVICES
  # ==========================================
  build-services:
    name: 🏗️ Build All Services
    runs-on: ubuntu-latest
    needs: [test-auth-service, test-property-service]
    
    strategy:
      matrix:
        service: [auth, property, user, report, insurance, ai, notification, analytics]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 🐳 Build ${{ matrix.service }}-service
        run: |
          docker build \
            -t propertyyards/${{ matrix.service }}-service:${{ github.sha }} \
            -f microservices/${{ matrix.service }}-service/Dockerfile \
            ./microservices/${{ matrix.service }}-service
      
      - name: 💾 Save Docker Image
        run: |
          docker save propertyyards/${{ matrix.service }}-service:${{ github.sha }} \
            > /tmp/${{ matrix.service }}-service.tar
      
      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-service-image
          path: /tmp/${{ matrix.service }}-service.tar

  # ==========================================
  # 🐳 DEPLOY MICROSERVICES (Production)
  # ==========================================
  deploy-microservices:
    name: 🐳 Deploy Microservices
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-services]
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          pattern: '*-service-image'
      
      - name: 🐳 Load Docker Images
        run: |
          for service in auth property user report insurance ai notification analytics; do
            docker load < /tmp/artifacts/${service}-service-image/${service}-service.tar
          done
      
      # Deploy to Railway/Render (example with Railway)
      - name: 🚂 Install Railway CLI
        run: npm i -g @railway/cli
      
      - name: 🚀 Deploy Services to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd microservices
          railway up --service=api-gateway
          # Deploy each service
          for service in auth property user report insurance ai notification analytics; do
            echo "Deploying ${service}-service..."
            # Railway deploy commands here
          done

  # ==========================================
  # 📝 QUALITY CHECKS
  # ==========================================
  lint:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 📦 Install Linters
        run: |
          pip install flake8 black isort mypy
      
      - name: 🔍 Run Flake8
        run: flake8 microservices/ --count --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: 🎨 Check Black Formatting
        run: black --check microservices/
      
      - name: 📋 Check Import Sorting
        run: isort --check-only microservices/

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 🔒 Run Bandit
        run: |
          pip install bandit
          bandit -r microservices/ -f json -o bandit-report.json || true
      
      - name: 🚨 Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: bandit-report.json

  # ==========================================
  # 📊 NOTIFICATIONS
  # ==========================================
  notify-success:
    name: 📢 Notify Success
    runs-on: ubuntu-latest
    needs: [deploy-microservices]
    if: success()
    
    steps:
      - name: 📧 Send Success Notification
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            ✅ **PropertyYards Backend Deployment Successful!**
            
            📦 Services: All microservices deployed
            📝 Commit: ${{ github.sha }}
            👤 Author: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-netlify:
    name: 🌐 Deploy Frontend to Netlify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Frontend
        run: npm run build

      - name: 🚀 Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './frontend/dist'
          production-branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions - ${{ github.sha }}"
          enable-pull-request-comment: true
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  notify-failure:
    name: 🚨 Notify Failure
    runs-on: ubuntu-latest
    needs: [test-auth-service, test-property-service, deploy-microservices]
    if: failure()
    
    steps:
      - name: 🚨 Send Failure Alert
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            🚨 **PropertyYards Deployment Failed!**
            
            ❌ Please check the logs
            🔗 Run: ${{ github.run_id }}
            📝 Commit: ${{ github.sha }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
